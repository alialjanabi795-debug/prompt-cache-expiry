# Tiers. Prices are parameters; re-verify against provider docs before the final runs.
# Cache semantics (DOC, verified 2026-10-19):
#   Anthropic: TTL measured from the START of the request that writes or reads the entry; a read
#   refreshes the timer at no cost; writes bill only the delta past the highest cache hit;
#   5m write = 1.25x, 1h write = 2x, read = 0.1x (Opus 4.8); min cacheable prefix 1024 tokens
#   (Opus 4.8); max_tokens=0 requests run prefill and bill zero output tokens (pre-warm/keep-alive).
#   OpenAI GPT-5.6+: ttl "30m" (eligible 30 min after most recent write or reuse), write 1.25x,
#   read 0.1x, min 1024 tokens.
# Latency numbers (prefill/decode/TTFT) are ASSUMPTIONS.

cloud_presets:
  anthropic_5m:
    provider: anthropic
    model: claude-opus-4-8          # EdgeWise evaluation cloud model
    ttl_s: 300
    write_mult: 1.25
    read_mult: 0.10
    min_cacheable_tokens: 1024
    price_in_per_mtok: 5.00
    price_out_per_mtok: 25.00
    prefill_tps: 5000.0
    cached_prefill_tps: 200000.0
    decode_tps: 45.0
    ttft_base_s: 0.8
    upload_mode: full
    tokenizer_ratio: 1.0
    ping_output_tokens: 0
    cache_static_prefix: true
    prices_source: claude-api skill model table (cached 2026-10-06) + prompt-caching reference
    prices_verified_on: "2026-10-19"
