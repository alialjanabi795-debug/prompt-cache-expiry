edge:
  _note: >-
    Mid-size model (e.g. a ~30B coder) on our own LAN server with a persistent, controllable
    prefix cache (no TTL, capacity-limited LRU). Cost = amortized server cost per token (ASSUMPTION).
  name: edge_lan
  model: qwen-30b-class
  prefill_tps: 3000.0
  decode_tps: 35.0
  rtt_s: 0.003
  lan_mbps: 300.0
  price_in_per_mtok: 0.15
  price_cached_per_mtok: 0.0
  price_out_per_mtok: 0.60
  cache_capacity_tokens: 2000000
